# Builds a personal test image for this fork and pushes it to
# ghcr.io/<owner>/sonarr. Reuses the repo's existing build action so the
# backend is compiled exactly like the official pipeline; only a thin runtime
# wrapper (Dockerfile.ghcr) is added on top.
#
# This workflow lives only on the media-notification-delay-image branch so it
# never ends up in the upstream pull request.
name: ghcr image

on:
  push:
    branches:
      - media-notification-delay-image
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FRAMEWORK: net10.0
  RUNTIME: linux-x64

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Compute build vars
        id: vars
        shell: bash
        run: |
          echo "branch=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          echo "version=5.0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Backend: same composite action the official pipeline uses. Produces a
      # runnable folder at _artifacts/${RUNTIME}/${FRAMEWORK}/Sonarr .
      - name: Build backend
        uses: ./.github/actions/build
        with:
          branch: ${{ steps.vars.outputs.branch }}
          version: ${{ steps.vars.outputs.version }}
          framework: ${{ env.FRAMEWORK }}
          runtime: ${{ env.RUNTIME }}
          package_tests: false

      # Frontend: same steps as the pipeline's "frontend" job.
      - name: Setup Node (Volta)
        uses: volta-cli/action@v5

      - name: Yarn install
        run: yarn install --frozen-lockfile

      - name: Build UI
        run: yarn build --env production

      - name: Place UI next to the binary
        run: cp -r _output/UI "_artifacts/${RUNTIME}/${FRAMEWORK}/Sonarr/UI"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sonarr
          tags: |
            type=raw,value=media-notification-delay
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: _artifacts/${{ env.RUNTIME }}/${{ env.FRAMEWORK }}/Sonarr
          file: Dockerfile.ghcr
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
